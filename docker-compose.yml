version: '3.8'

services:
  # AI Library API Server
  ai-library:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-library-api
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "9090:9090"  # Metrics
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - ENABLE_AUTH=true
      - RATE_LIMIT_ENABLED=true
      - CACHE_ENABLED=true
      - CACHE_TYPE=redis
      - REDIS_HOST=redis
      - METRICS_ENABLED=true
    env_file:
      - .env.production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./books:/app/books
      - ./models:/app/models
    depends_on:
      - redis
    networks:
      - ai-library-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: ai-library-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ai-library-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-library-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - ai-library-network
    depends_on:
      - ai-library

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: ai-library-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    networks:
      - ai-library-network
    depends_on:
      - prometheus

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: ai-library-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - ai-library-network
    depends_on:
      - ai-library

networks:
  ai-library-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
